name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  model-free-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install locked test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.lock
          python -m pip install --no-deps -e .

      - name: Run model-free engineering and closure-controller tests
        run: python -m unittest tests.test_g9_engineering tests.test_g9_api tests.test_portfolio_closure -v
