[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behaviortune"
version = "1.0.0"
description = "Reproducible behavioral post-training and evaluation for Qwen3-4B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi==0.135.3",
  "uvicorn==0.44.0",
]

[project.scripts]
behaviortune = "behaviortune.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
